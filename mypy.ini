# mypy configuration for wuthering-waves-scancer.
#
#   mypy --ignore-missing-imports .
#
# utils.abogus is vendored third-party code (kept verbatim for easy
# upstream merges) and is excluded from type checking.

[mypy]
ignore_missing_imports = True
show_error_codes = True

[mypy-utils.abogus]
ignore_errors = True
